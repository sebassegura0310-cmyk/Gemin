<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Créditos</title>
  <!-- Fuente Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-purple: #8b5cf6;
      --primary-hover: #7c3aed;
      --accent-glow: rgba(139, 92, 246, 0.4);
      --bg-gradient-start: #0f0a1e;
      --bg-gradient-end: #2e1065;
      --card-bg: rgba(255, 255, 255, 0.96);
      --text-dark: #1e1b4b;
      --text-muted: #6b7280;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 30px -5px rgba(0, 0, 0, 0.4), 0 10px 15px -5px rgba(124, 58, 237, 0.2);
      text-align: center;
    }

    .icon-wrapper {
      width: 88px;
      height: 88px;
      background: #f5f3ff;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      box-shadow: 0 4px 12px var(--accent-glow);
      animation: pulse 2.5s infinite ease-in-out;
    }

    .icon-wrapper svg {
      width: 44px;
      height: 44px;
      fill: var(--primary-purple);
    }

    h1 {
      color: var(--text-dark);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p.description {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 16px 24px;
      background: linear-gradient(135deg, #8b5cf6 0%, #6d28d9 100%);
      color: #ffffff;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      text-decoration: none;
      border-radius: 14px;
      box-shadow: 0 4px 15px var(--accent-glow);
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Efecto de brillo que cruza el botón */
    .btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent,
        rgba(255, 255, 255, 0.35),
        transparent
      );
      transition: all 0.6s ease;
    }

    /* Animación al interactuar / pasar el mouse */
    .btn:hover {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5);
    }

    .btn:hover::before {
      left: 100%;
    }

    .btn:active {
      transform: translateY(-1px) scale(0.99);
    }

    /* Animación suave flotante continua para destacar los botones */
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-4px); }
    }

    .btn-pulse {
      animation: float 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Icono Ilustrativo (Mano con Dinero / Solicitud) -->
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10 A10 10 0 0 0 12 2zm1 14.93V18e-01h-2v-1.07A3 3 0 0 1 9 14h2a1 1 0 0 0 2 0 1 1 0 0 0-1-1h-2a3 3 0 0 1 0-6V6h2v1.07A3 3 0 0 1 15 10h-2a1 1 0 0 0-2 0 1 1 0 0 0 1 1h2a3 3 0 0 1 0 5.93z"/>
      </svg>
    </div>

    <h1>CRÉDITOS</h1>
    
    <p class="description">
      Solicita tu crédito <strong>sin ningún tipo de inicial o anticipado</strong>. Haz clic en la opción que prefieras, marca la cantidad que deseas y sigue los pasos en pantalla. ¡Mucho éxito!
    </p>

    <!-- Enlaces con movimiento y efectos -->
    <div class="btn-container">
      <!-- REEMPLAZA EL ENLACE POR EL TUYO -->
      <a href="https://TU-LINK-AQUI-1.com" class="btn btn-pulse" target="_blank" rel="noopener noreferrer">
        SOLICITAR #1
      </a>

      <!-- REEMPLAZA EL ENLACE POR EL TUYO -->
      <a href="https://TU-LINK-AQUI-2.com" class="btn" target="_blank" rel="noopener noreferrer">
        SOLICITAR #2
      </a>
    </div>

    <div class="footer-note">
      🔒 Proceso 100% seguro y sin pagos previos.
    </div>
  </div>

</body>
</html>

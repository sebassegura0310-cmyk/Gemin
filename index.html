<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solicitud de Créditos</title>
  <!-- Fuente Google Fonts (Inter) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary-color: #10b981;
      --primary-hover: #059669;
      --bg-gradient-start: #0f172a;
      --bg-gradient-end: #064e3b;
      --card-bg: rgba(255, 255, 255, 0.95);
      --text-dark: #1e293b;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--bg-gradient-start) 0%, var(--bg-gradient-end) 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border-radius: 24px;
      padding: 40px 28px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      text-align: center;
    }

    .icon-wrapper {
      width: 88px;
      height: 88px;
      background: #ecfdf5;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto 24px;
      box-shadow: 0 4px 6px -1px rgba(16, 185, 129, 0.2);
    }

    .icon-wrapper svg {
      width: 48px;
      height: 48px;
      fill: var(--primary-color);
    }

    h1 {
      color: var(--text-dark);
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 12px;
    }

    p.description {
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.6;
      margin-bottom: 32px;
    }

    .btn-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 16px 24px;
      background-color: var(--primary-color);
      color: #ffffff;
      font-weight: 600;
      font-size: 16px;
      text-decoration: none;
      border-radius: 12px;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
      transition: all 0.2s ease-in-out;
    }

    .btn:hover {
      background-color: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.35);
    }

    .btn:active {
      transform: translateY(0);
    }

    .footer-note {
      margin-top: 24px;
      font-size: 12px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Icono Ilustrativo Profesional (Mano con Dinero) -->
    <div class="icon-wrapper">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path d="M12 2a10 10 0 1 0 10 10 A10 10 0 0 0 12 2zm1 14.93V18e-01h-2v-1.07A3 3 0 0 1 9 14h2a1 1 0 0 0 2 0 1 1 0 0 0-1-1h-2a3 3 0 0 1 0-6V6h2v1.07A3 3 0 0 1 15 10h-2a1 1 0 0 0-2 0 1 1 0 0 0 1 1h2a3 3 0 0 1 0 5.93z"/>
      </svg>
    </div>

    <h1>CRÉDITOS</h1>
    
    <p class="description">
      Solicita tu crédito <strong>sin ningún tipo de inicial o anticipado</strong>. Haz clic en la opción que prefieras, marca la cantidad que deseas y sigue los pasos en pantalla. ¡Mucho éxito!
    </p>

    <!-- Botones de Enlace -->
    <div class="btn-container">
      <!-- REEMPLAZA EL '#' POR TU ENLACE 1 -->
      <a href="https://TU-LINK-AQUI-1.com" class="btn" target="_blank" rel="noopener noreferrer">
        SOLICITAR OP-1
      </a>

      <!-- REEMPLAZA EL '#' POR TU ENLACE 2 -->
      <a href="https://TU-LINK-AQUI-2.com" class="btn" target="_blank" rel="noopener noreferrer">
        SOLICITAR OP-2
      </a>
    </div>

    <div class="footer-note">
      🔒 Proceso 100% seguro y sin pagos previos.
    </div>
  </div>

</body>
</html>
